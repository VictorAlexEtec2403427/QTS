<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETEC Games</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/bootstrap.min.js"></script>
</head>
<body>
    <!--Início do Menu-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><img src="/Bootstrap/games/imagens/imagens/logo.png" alt="ETEC Games"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#produtos">Produtos</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#localizacao">Localização</a>
                </li>
                <li class="nav-item">
                <a class="nav-link" href="#contato">Contato</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
    <!-- Fim do Menu-->

    <!-- Início do Carrossel-->
    <div id="carouselExampleIndicators" class="carousel slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
            <img src="./imagens/imagens/01.jpg" class="d-block w-100" alt="Descrição imagem 1">
            </div>
            <div class="carousel-item">
            <img src="./imagens/imagens/02.jpg" class="d-block w-100" alt="Descrição imagem 2">
            </div>
            <div class="carousel-item">
            <img src="./imagens/imagens/03.jpg" class="d-block w-100" alt="Descrição imagem 3">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!-- Fim do Carrossel-->

    <!-- Início da área de novidade-->
     <section id="novidades" class="container">
        <p class="fs-1 text-center mt-5">Novidades</p>
     </section>
     <!-- Fim da área de novidade-->

     
</body>
</html>
